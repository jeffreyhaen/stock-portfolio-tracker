name: CI

on:
    push:
        branches: [master, main]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Prettier
              run: npx prettier --check .

            - name: Lint
              run: npx ng lint

            - name: Unit tests
              run: npx ng test

            - name: Build
              run: npx ng build --configuration production
