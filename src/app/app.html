<header class="border-b border-base-300 bg-base-100">
    <nav class="mx-auto flex h-14 max-w-[1200px] items-center gap-6 px-6">
        <a routerLink="/" class="flex items-center gap-2 text-base font-semibold">
            <img src="logo.png" alt="Stock Portfolio" class="h-8 w-8 rounded-field object-cover" />
            <span>Stock Portfolio</span>
        </a>
        @if (portfolioId() !== '') {
        <a
            [routerLink]="['/portfolio', portfolioId(), 'dashboard']"
            routerLinkActive="bg-primary-soft text-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Dashboard</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'forecast']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Forecast</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'projection']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Projection</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'holdings']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Holdings</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'cash']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Cash</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'transactions']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Transactions</a
        >
        <a
            [routerLink]="['/portfolio', portfolioId(), 'prices']"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Prices</a
        >
        }
        <a
            routerLink="/portfolios"
            routerLinkActive="bg-primary-soft text-primary"
            class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
            >Portfolios</a
        >
        <div class="ml-auto flex items-center gap-3">
            <button
                type="button"
                (click)="toggleTheme()"
                [title]="themeLabels[themePreference()]"
                [aria-label]="themeLabels[themePreference()]"
                class="flex h-8 w-8 items-center justify-center rounded-field text-text-secondary hover:bg-base-200"
            >
                @if (themePreference() === 'light') {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                    />
                </svg>
                } @else if (themePreference() === 'dark') {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                    />
                </svg>
                } @else {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25"
                    />
                </svg>
                }
            </button>
            <a
                routerLink="/settings"
                routerLinkActive="bg-primary-soft text-primary"
                class="rounded-field px-3 py-1.5 text-sm text-text-secondary hover:bg-base-200"
                >Settings</a
            >
            @if (portfolioName() !== '') {
            <span class="rounded-full bg-base-200 px-3 py-1 text-xs font-medium text-base-content/70"
                >{{ portfolioName() }}</span
            >
            }
        </div>
    </nav>
</header>

<main class="mx-auto max-w-[1200px] px-6 py-8">
    <router-outlet />
</main>
