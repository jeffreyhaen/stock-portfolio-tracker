<h1 class="text-3xl font-bold">Prices</h1>
<p class="mt-1 text-sm text-base-content/60">
    Ticker links and quotes per security. Set up once; stored in the database.
</p>

@if (isEmpty()) {
<section class="mt-6 rounded-xl border border-base-300 bg-base-100 p-6">
    <div class="py-10 text-center">
        <p class="text-sm text-base-content/60">No data yet.</p>
        <a routerLink="/portfolios" class="btn btn-primary btn-sm mt-4">Import your first CSV</a>
    </div>
</section>
} @else {
<div class="mt-6">
    <app-quote-panel [holdings]="holdings()" [fromDate]="firstDate()" />
</div>
}
